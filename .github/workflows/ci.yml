name: CI

on:
  push:
    branches: [main, "livesend-*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate Claude Code plugin
        run: npm run validate:plugin
      - name: Validate deploy config
        run: npm run validate:deploy

  smoke:
    needs: check
    runs-on: ubuntu-latest
    # End-to-end check against a live deployment (publish, fetch the viewer
    # shell + its iframe, redeem a share link) — see scripts/smoke.mjs. Needs
    # a real RTFX_API_TOKEN, which forks and external PRs never have, so this
    # step is skipped rather than failed when the secret isn't set.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test
        run: |
          if [ -z "$RTFX_API_TOKEN" ]; then
            echo "Skipping production smoke: RTFX_API_TOKEN is not configured for this run."
            exit 0
          fi
          npm run smoke
        env:
          ARTIFACTS_URL: ${{ vars.ARTIFACTS_URL }}
          RTFX_API_TOKEN: ${{ secrets.RTFX_API_TOKEN }}
          # The script refuses an interactive production run; CI is the sanctioned one.
          CI: "true"
